  * { box-sizing: border-box; }

    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 var(--font);

  }

  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }

  /* Sidebar */

    background: var(--side);

  .ws { display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
  .ws-mark {
    width: 22px; height: 22px; border-radius: 6px;

    display: grid; place-items: center;
    font: 600 10px/1 var(--font); letter-spacing: .04em;
  }
  .ws-name { font-weight: 600; }
  .ws-sub { color: var(--ink-3); font-size: 12px; }
  .nav-group { display: flex; flex-direction: column; gap: 1px; }
  .nav-label {
    color: var(--ink-3); font-size: 11px; font-weight: 500;
    padding: 0 8px 4px; letter-spacing: .02em;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 6px; border: 0; background: none;
    text-align: left; color: var(--ink-2); width: 100%;
  }
  .nav-item:hover { background: var(--hover); color: var(--ink); }
  .nav-item[aria-current="true"] { background: var(--active); color: var(--ink); font-weight: 500; }
  .nav-item .count { margin-left: auto; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .nav-item svg { flex: none; }
  .ring { flex: none; }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }

    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
    background: var(--bg); min-height: 46px; flex-wrap: wrap;
  }
  .bar h1 { font-size: 13px; font-weight: 500; margin: 0; }
  .bar .crumb { color: var(--ink-3); }
  .bar .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); padding: 3px 9px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--active); color: var(--ink); }

    border: 1px solid var(--line); background: var(--panel); border-radius: 6px;

  .note-bar {
    margin: 0; padding: 8px 20px; font-size: 12px; color: var(--ink-2);
    background: var(--accent-soft); border-bottom: 1px solid var(--line);
  }

  /* Issue list */
  .group-head {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 20px; background: var(--side);
    border-bottom: 1px solid var(--line-2);
    font-weight: 500;
  }
  .group-head .count { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }

    display: grid;
    grid-template-columns: 22px 66px 18px minmax(0, 1fr) auto auto 34px;
    align-items: center; gap: 10px;
    padding: 0 20px; height: 38px; width: 100%;
    border: 0; border-bottom: 1px solid var(--line-2);
    background: var(--bg); text-align: left; color: var(--ink);

  .row:hover { background: var(--hover); }
  .row[aria-selected="true"] { background: var(--active); }

  .est { color: var(--ink-3); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 48px 20px; color: var(--ink-3); text-align: center; }
  .skeleton { height: 38px; border-bottom: 1px solid var(--line-2); position: relative; }

    content: ""; position: absolute; left: 20px; right: 40%; top: 14px; height: 10px;
    border-radius: 4px; background: var(--line-2);
  }

  .doc { max-width: 820px; padding: 28px 28px 64px; display: flex; flex-direction: column; gap: 28px; }
  .doc h2 { font-size: 20px; font-weight: 600; margin: 0 0 6px; text-wrap: balance; letter-spacing: -.01em; }
  .doc h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .doc p { margin: 0; color: var(--ink-2); max-width: 68ch; }
  .doc p + p { margin-top: 8px; }
  .lede { font-size: 14px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; color: var(--ink-2); }
  pre.diagram {
    margin: 0; padding: 14px 16px; overflow-x: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    font: 12px/1.55 var(--mono); color: var(--ink-2);
  }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }

  .card-foot { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

  .decision { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .decision-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .decision-head h3 { margin: 0; }
  .badge { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.open { color: var(--decision); }
  .badge.decided { color: var(--st-done); }
  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start;
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--bg);
    text-align: left; color: var(--ink); width: 100%;
  }
  .option:hover { border-color: var(--ink-3); }
  .option[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .option .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-top: 2px; }
  .option[aria-checked="true"] .dot { border: 4px solid var(--accent); }
  .option b { font-weight: 500; }
  .option small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
  .rec { color: var(--accent); font-size: 11.5px; font-weight: 500; margin-left: 6px; }

  /* Detail panel */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 18%); z-index: 10; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 11;
    width: min(620px, 100%); background: var(--panel); box-shadow: var(--shadow);
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);

  .panel-top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .panel-top .spacer { flex: 1; }
  .icon-btn { border: 0; background: none; padding: 4px 8px; border-radius: 6px; color: var(--ink-2); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .panel-body { overflow-y: auto; padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 22px; }
  .panel-body h2 { font-size: 19px; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  .props { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; align-items: center; }
  .props dt { color: var(--ink-3); font-size: 12px; }
  .props dd { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .select {
    appearance: none; border: 1px solid var(--line); background: var(--bg); border-radius: 6px;
    padding: 3px 26px 3px 8px; color: var(--ink);
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: calc(100% - 13px) 55%, calc(100% - 9px) 55%;
    background-size: 4px 4px; background-repeat: no-repeat;
  }
  .select:disabled { opacity: .7; }
  .section h3 { font-size: 12px; font-weight: 500; color: var(--ink-3); margin: 0 0 8px; letter-spacing: .02em; }
  .section p { margin: 0; color: var(--ink); max-width: 66ch; }
  .section ol, .section ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
  .section li { padding-left: 2px; }
  .checks { list-style: none; padding-left: 0 !important; }
  .checks li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; }
  .checks li::before { content: ""; width: 12px; height: 12px; border: 1.5px solid var(--ink-3); border-radius: 3px; margin-top: 3px; }
  .section pre {
    margin: 0; padding: 12px 14px; overflow-x: auto;

    font: 12px/1.55 var(--mono); color: var(--ink-2);
  }
  .link-btn { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .link-btn:hover { text-decoration-color: currentColor; }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 7px 12px; border-radius: 6px; z-index: 20; font-size: 12.5px;
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .side {
      flex-direction: row; gap: 4px; padding: 8px 12px; overflow-x: auto; overflow-y: hidden;
      border-right: 0; border-bottom: 1px solid var(--line); align-items: center;

    .ws, .nav-label { display: none; }
    .nav-group { flex-direction: row; gap: 4px; }
    .nav-item { width: auto; white-space: nowrap; }
    .nav-item .count { margin-left: 4px; }
    .bar { padding: 8px 16px; }
    .search { width: 100%; max-width: none; order: 5; }
    .row { grid-template-columns: 18px 58px 16px minmax(0, 1fr) 30px; padding: 0 16px; gap: 8px; }
    .row .chips, .row .proj { display: none; }
    .group-head { padding: 7px 16px; }
    .doc { padding: 20px 16px 48px; }
    .panel-body { padding: 16px 16px 40px; }
    .props { grid-template-columns: 84px 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: slide .16s ease-out; }
    @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
  }
</style>

<script type="application/json" id="roadmap-data">{"projects":[{"id":"p0","name":"Ground work","order":0,"short":"Ground work","summary":"Get PR #4 onto main, settle the open calls, and protect the data layer from the sync script.","target":"Before any backend code"},{"id":"p1","name":"Supabase foundation","order":1,"short":"Foundation","summary":"Project, migrations, row-level security enforcing owner + two-factor, a private image bucket, generated types.","target":"Schema, RLS, Storage"},{"id":"p2","name":"Sign-in and two-factor","order":2,"short":"Sign-in","summary":"Username sign-in through an Edge Function, a real session behind the synchronous getSession(), and TOTP.","target":"Real accounts"},{"id":"p3","name":"Library data","order":3,"short":"Library","summary":"Collections, references, notes, tags, pins and uploads move from browser storage to Postgres and Storage.","target":"Same functions, real rows"},{"id":"p4","name":"Boards","order":4,"short":"Boards","summary":"Publish, rotate and unpublish in Postgres; a signed-out Edge Function serves boards with short-lived image URLs.","target":"/m/:token for real"},{"id":"p5","name":"Invites","order":5,"short":"Invites","summary":"Invite requests stored server-side, deduplicated by email, with a notification to you.","target":"Requests reach you"},{"id":"p6","name":"Move in and ship","order":6,"short":"Ship","summary":"Seed moode-matcha into Storage, set env and secrets, re-verify pixel parity and RLS, deploy.","target":"kept.design"},{"id":"p7","name":"Later","order":7,"short":"Later","summary":"Worth doing, not needed for v0: box annotations, renaming, server search, share previews.","target":"After v0"}],"decisions":[{"chosen":null,"id":"d1","key":"D-1","options":[{"detail":"The browser sends username + password to a function that looks up the email with the service role and signs in server-side. Emails never leave the server, and an unknown username gives the same error as a wrong password.","id":"edge","label":"Edge Function `sign-in`"},{"detail":"Each account's email is `username@users.kept.design`. No server code, but no real inbox for recovery or notices.","id":"synthetic","label":"Synthetic emails"},{"detail":"An anon-callable `email_for_username()`. Simplest, but it lets anyone enumerate usernames and read their emails. Not recommended.","id":"rpc","label":"Public lookup function"}],"order":1,"question":"Kept signs in by username, but Supabase Auth signs in by email. Something has to turn a username into an email without letting anyone look up whose account is whose.","recommended":"edge","title":"How usernames sign in"},{"chosen":null,"id":"d2","key":"D-2","options":[{"detail":"The function checks the token and returns URLs that expire (about an hour). Unpublish and New link take effect immediately for new visits. One bucket, nothing public.","id":"signed","label":"Signed URLs from the `board` function"},{"detail":"Publishing copies files into a public bucket. Links never expire and CDN caching is simpler, but every publish, rotate and unpublish has to copy or delete files.","id":"public","label":"Public copies of published images"}],"order":2,"question":"Library images stay in a private bucket. Boards are opened by people who aren't signed in, so their images need a different path.","recommended":"signed","title":"How board images are served"},{"chosen":null,"id":"d3","key":"D-3","options":[{"detail":"Billed through Vercel; env vars sync to Production, Preview and Development automatically. Vite only exposes `VITE_`-prefixed vars, so `vite.config` adds the integration's `NEXT_PUBLIC_SUPABASE_` prefix to `envPrefix`.","id":"marketplace","label":"Vercel Marketplace integration"},{"detail":"Billed by Supabase; env vars are copied into Vercel by hand. Nothing else changes.","id":"direct","label":"supabase.com directly"}],"order":3,"question":"Supabase can be created directly on supabase.com or through the Vercel Marketplace integration.","recommended":"marketplace","title":"Where Supabase is provisioned"},{"chosen":null,"id":"d4","key":"D-4","options":[{"detail":"`repository.ts` picks the Supabase implementation when configured, else the synced mock. The lab account `wade / 1234` keeps working locally. This matches the v0 spec.","id":"fallback","label":"Fall back to the mocks"},{"detail":"Simpler code paths, but every preview and fresh clone needs real credentials.","id":"strict","label":"Require Supabase everywhere"}],"order":4,"question":"When Supabase env vars are missing (a fresh clone, a preview without secrets), the app can either fall back to kept-ui's mocks or refuse to start.","recommended":"fallback","title":"Keep the mocks as a fallback"},{"chosen":null,"id":"d5","key":"D-5","options":[{"detail":"Delete `public/collections/` from main once KEPT-28 has moved them into Storage. They stay in git history, but the app stops depending on them.","id":"remove","label":"Remove them after the seed"},{"detail":"Useful for the mock fallback on previews. Costs repo size and keeps the images public.","id":"keep","label":"Keep them in the repo"}],"order":5,"question":"PR #3 already committed the 320 moode-matcha files to main (the repo is public). Once they're in Storage, the copies in `public/collections/` aren't needed.","recommended":"remove","title":"Collection images in git"}],"issues":[{"acceptance":["All 16 routes identical to kept-ui.vercel.app","Interactive states identical (dialogs, menus, search, lightbox, keyboard stepping, sign-in redirects)"],"blockedBy":[],"estimate":8,"key":"KEPT-0","labels":["ui"],"notes":"Commits `969134d` and `7e9ddba` on `cursor/snapshot-kept-ui-a2a8`, open as PR #4.","priority":2,"project":"p0","status":"done","steps":["Synced `src/kept` with `scripts/sync-kept-ui.mjs`, which rewrites `#/kept/...` routes into paths.","Added `navigate.ts` and a `useSyncExternalStore` router so links don't reload and redirects aren't missed.","Removed the legacy home and map pages; matched kept-ui's dependency v rect URLs.","`npx supabase init`, `supabase link`, migrations under `supabase/migrations/`.","Add `.env.example` with `VITE_SUPABASE_URL` and `VITE_SUPABASE_PUBLISHABLE_KEY`; real values in `.env.local` (git-ignored) and Vercel."],"summary":"Everything else needs a project, the CLI, and migrations in the repo so the schema is reviewable.","title":"Create the Supabase project and local setup"},{"acceptance":["Every field the UI reads maps to a column (see the seam table)","Slugs unique per owner; tokens and public ids unique globally","Migration is idempotent against a fresh project"],"blockedBy":["KEPT-7"],"code":"profiles      id uuid pk → auth.users · username citext unique (2–32 [a-z0-9._-])\ncollections   id uuid pk · owner_id · slug text · name text (≤80) · description text\n              created_at · updated_at · unique (owner_id, slug)\nrefs          id uuid pk · public_id text unique · owner_id · collection_id → collections\n              title · notes · capture_url (null = uploaded) · added_at · updated_at\n              search tsvector generated\nassets        id uuid pk · ref_id → refs (cascade) · owner_id · path_full · path_thumb\n              file_name · file_type · width · height · bytes\ntags          id uuid pk · owner_id · name citext · unique (owner_id, name)\nref_tags      ref_id → refs · tag_id → tags · pk (ref_id, tag_id)\nannotations   id uuid pk · ref_id → refs (cascade) · owner_id · kind ('pin'|'box')\n              x · y · w · h (null for pins) · caption · position int\ncollection_shares  collection_id pk → collections (cascade) · token text unique\n                   published_at · rotated_at\ninvite_requests    id uuid pk · name · email citext unique · note (≤500)\n                   requested_at · status ('waiting'|'invited'|'declined')","estimate":5,"key":"KEPT-8","labels":["db"],"priority":1,"project":"p1","status":"backlog","steps":["Write `0001_schema.sql` with the tables below; UUID primary keys, `owner_id` on every row for RLS.","Collections keep a `slug` because the UI uses it as the collection id in URLs (`/library/moode-matcha`). References keep a short `public_id` for `/library/:c/:r`.","`references` is a reserved word in SQL, so the table is `refs`.","Add `updated_at` triggers, and a generated `search` tsvector on refs for later server search (KEPT-34)."],"summary":"Turns the shapes in `repository.ts` into tables. A Reference is the unit of meaning; its Asset carries the file facts; v0 has one asset and one collection per reference.","title":"Schema migration"},{"acceptance":["pgTAP (or SQL) tests: user B can't select, update or delete user A's rows in any table","An aal1 session reads zero rows","anon reads zero rows from every table"],"blockedBy":["KEPT-8"],"code":"create policy \"own rows\" on refs for all to authenticated\n  using (owner_id = auth.uid()) with check (owner_id = auth.uid());\ncreate policy \"require mfa\" on refs as restrictive for all to authenticated\n  using ((auth.jwt() ->> 'aal') = 'aal2');","estimate":3,"key":"KEPT-9","labels":["db","security"],"priority":1,"project":"p1","status":"backlog","steps":["Enable RLS on every table. No policies on `invite_requests` or `collection_shares` for anon.","One permissive policy per table for select/insert/update/delete: `owner_id = auth.uid()`.","One restrictive policy per table: `(auth.jwt() ->> 'aal') = 'aal2'`.","`profiles`: a user reads and updates only their own row; usernames are set by you, not the user.","Signed-out access goes only through SECURITY DEFINER functions with narrow return shapes (board, invite)."],"summary":"The browser talks straight to Postgres, so RLS is the whole security model. Checking `aal2` in the policies means a stolen password without the second factor reads nothing.","title":"Row-level security: owner and two-factor on every row"},{"acceptance":["A signed-in user can upload and sign URLs only under their own folder","Unsigned object URLs return 400/404","Another user's paths can't be signed"] till can't select from `invite_requests`"],"blockedBy":["KEPT-9"],"estimate":2,"key":"KEPT-26","labels":["db","security"],"priority":2,"project":"p5","status":"backlog","steps":["RPC `request_invite(name, email, note)`, SECURITY DEFINER, executable by anon: validate lengths and email shape, `insert … on conflict (email) do nothing`, return `{ alreadyRequested }`.","Honeypot field + a per-IP rate limit to keep bots out; add Turnstile later only if spam shows up.","`requestInvite()` in the repository calls the RPC."],"summary":"Today requests live only in the requester's browser, so you never see them. The form, its errors and the two confirmation states stay the same.","title":"Store invite requests server-side"},{"acceptance":["A test request reaches your inbox within a minute"],"blockedBy":["KEPT-26"],"estimate":2,"key":"KEPT-27","labels":["edge function","ops"],"priority":3,"project":"p5","status":"backlog","steps":["Database webhook on `invite_requests` insert → Edge Function `notify-invite` → email to you via Resend (or a Slack webhook).","Approving = KEPT-16's steps for their account, then set `status = 'invited'`."],"summary":"A request nobody sees is the same as no request.","title":"Tell you when someone asks for an invite"},{"acceptance":["Library shows 1 collection, 160 references with images","`/m/mm7q2x9kfa` works signed out"],"blockedBy":["KEPT-21","KEPT-23","KEPT-16"],"estimate":3,"key":"KEPT-28","labels":["data","ops"],"priority":2,"project":"p6","status":"backlog","steps":["`scripts/seed-moode-matcha.mjs`, run locally with the service-role key from `.env.local` (never committed).","Create the collection `moode-matcha` for `wade`, upload all 160 full and thumb files, insert refs and assets with the file facts from the JSON.","Publish it with the existing token `mm7q2x9kfa` so the board link you've already shared keeps working.","Idempotent: re-running skips what exists."],"summary":"Your real collection has to move from `public/collections/` and `data/moode-matcha.json` into your account.","title":"Seed moode-matcha into Storage"},{"acceptance":["`grep` of `dist/` finds no service-role key","Previews without secrets fall back to the mocks (D-4)"],"blockedBy":["KEPT-7"],"estimate":1,"key":"KEPT-29","labels":["infra","security"],"priority":1,"project":"p6","status":"backlog","steps":["Vercel (Production + Preview): `VITE_SUPABASE_URL`, `VITE_SUPABASE_PUBLISHABLE_KEY`, `VITE_PUBLIC_ORIGIN`.","Edge Function secrets: service-role key, Resend key.","Local: `.env.local` for the app and the seed script; `.env.example` committed without values.","Check the production bundle for anything that looks like a service key before the first deploy."],"summary":"Only the publishable key may reach the browser.","title":"Environment variables and secrets"},{"acceptance":["All three pass on the production project before the domain switch"],"blockedBy":["KEPT-28","KEPT-24","KEPT-26"],"estimate":3,"key":"KEPT-30","labels":["security","ui"],"priority":1,"project":"p6","status":"backlog","steps":["Re-run the pixel sweep against kept-ui with the same collection seeded: every route and state identical (share URLs excepted).","End to end: sign in → TOTP → create collection → upload → pin → tag → notes → publish → open board signed out → New link → Unpublish → invite request.","RLS tests from KEPT-9 pass against the deployed project.","Log a health run (`health/log.csv`) for the release."],"summary":"Real data mustn't change how anything looks, and the security model needs proof, not assumption.","title":"Verify: pixel parity, end-to-end and RLS"},{"acceptance":["kept.design serves the real app with real data"],"blockedBy":["KEPT-30","KEPT-29","KEPT-1"],"estimate":1,"key":"KEPT-31","labels":["ops"],"priority":1,"project":"p6","status":"backlog","steps":["Merge to main → Vercel production deploy.","Point `kept.design` at the project; check `/`, `/library` (signed in), and a board signed out.","Tick “Ship to kept.design” in Kept's own To do page."],"summary":"The finish line for v0.","title":"Ship to kept.design"},{"acceptance":[],"blockedBy":[],"estimate":5,"key":"KEPT-32","labels":["kept-ui first","ui"],"priority":4,"project":"p7","status":"backlog","steps":[],"summary":"Pins only today. The schema already allows `kind = 'box'` with `w`/`h`. Design the drag-to-draw interaction in kept-ui first.","title":"Box annotations"},{"acceptance":[],"blockedBy":[],"estimate":2,"key":"KEPT-33","labels":["kept-ui first","ui"],"priority":4,"project":"p7","status":"backlog","steps":[],"summary":"Uploads take the file name as the title. Needs an editable title in kept-ui, then `updateReference` accepts `title`.","title":"Rename references"},{"acceptance":[],"blockedBy":[],"estimate":5,"key":"KEPT-34","labels":["db","ui"],"priority":4,"project":"p7","status":"backlog","steps":[],"summary":"When the library outgrows client filtering: an RPC over the `search` tsvector (titles, notes, tags, pin captions), and a Base UI Combobox palette designed in kept-ui.","title":"Server-side search and a command palette"},{"acceptance":[],"blockedBy":[],"estimate":3,"key":"KEPT-35","labels":["edge function"],"priority":4,"project":"p7","status":"backlog","steps":[],"summary":"A preview card when a board link is pasted into a chat. A tiny OG endpoint for `/m/:token`, without moving the app to Next.js.","title":"Board link previews"},{"acceptance":[],"blockedBy":[],"estimate":3,"key":"KEPT-36","labels":["storage","infra"],"priority":0,"project":"p7","status":"backlog","steps":[],"summary":"Out of scope for v0 by design. Revisit only if egress or storage costs become real.","title":"Move images to R2 if Storage costs bite"}]}</script>
<script>
(() => {
  const STATUSES = [
    { id: 'in_progress', label: 'In progress' },
    { id: 'in_review', label: 'In review' },
    { id: 'todo', label: 'Todo' },
    { id: 'backlog', label: 'Backlog' },
    { id: 'done', label: 'Done' },
    { id: 'canceled', label: 'Canceled' },
  ];
  const PRIORITIES = [
    { id: 1, label: 'Urgent' }, { id: 2, label: 'High' }, { id: 3, label: 'Medium' },
    { id: 4, label: 'Low' }, { id: 0, label: 'No priority' },
  ];
  const LABEL_COLORS = {
    decision: 'var(--decision)', 'kept-ui first': 'var(--urgent)', security: '#d0493a',
    db: '#3b82c4', auth: '#b0791c', storage: '#2a9d8f', 'edge function': '#8c6bd6',
    infra: '#6b7280', ui: '#d0578c', data: '#3b82c4', ops: '#6b7280',
  };

  const state = {
    view: 'all',            // all | active | backlog | done | overview | decisions | project:<id>
    group: 'status',        // status | project
    query: '',
    open: null,             // issue key in the panel
    issues: [], projects: [], decisions: [],
    loaded: false, dbOk: null, writable: true, static: false,
  };
  try {
    const saved = JSON.parse(localStorage.getItem('kbr.prefs') || '{}');
    if (saved.view) state.view = saved.view;
    if (saved.group) state.group = saved.group;
  } catch {}
  const savePrefs = () => { try { localStorage.setItem('kbr.prefs', JSON.stringify({ view: state.view, group: state.group })); } catch {} };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
  const issueNum = (k) => Number(String(k).split('-')[1]) || 0;

  /* Icons */
  function statusIcon(id, size = 14) {
    const c = `var(--st-${{ in_progress: 'progress', in_review: 'review', canceled: 'canceled' }[id] || id})`;
    const r = 6, cx = 7;
    const ring = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${c}" stroke-width="1.5"${id === 'backlog' ? ' stroke-dasharray="2.2 2"' : ''}/>`;
    let inner = '';
    if (id === 'in_progress') inner = `<path d="M7 3.5 A3.5 3.5 0 0 1 7 10.5 Z" fill="${c}"/>`;
    if (id === 'in_review') inner = `<path d="M7 3.5 A3.5 3.5 0 1 1 3.5 7 L7 7 Z" fill="${c}"/>`;
    if (id === 'done') return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="${c}"/><path d="M4.3 7.2 6.2 9 9.8 5.2" fill="none" stroke="var(--panel)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (id === 'canceled') return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="${c}"/><path d="M5 5 9 9M9 5 5 9" stroke="var(--panel)" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true">${ring}${inner}</svg>`;
  }
  function priorityIcon(p) {
    if (p === 1) return `<svg width="14" height="14" viewBox="0 0 14 14" aria-label="Urgent" role="img"><rect x="1" y="1" width="12" height="12" rx="3" fill="var(--urgent)"/><path d="M7 3.8v4" stroke="var(--panel)" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10.1" r=".95" fill="var(--panel)"/></svg>`;
    if (!p) return `<svg width="14" height="14" viewBox="0 0 14 14" aria-label="No priority" role="img"><g fill="var(--ink-3)"><rect x="1.5" y="6.3" width="2.4" height="1.4" rx=".6"/><rect x="5.8" y="6.3" width="2.4" height="1.4" rx=".6"/><rect x="10.1" y="6.3" width="2.4" height="1.4" rx=".6"/></g></svg>`;
    const lit = { 2: 3, 3: 2, 4: 1 }[p];
    const bars = [[2, 8, 4], [6, 5, 7], [10, 2, 10]].map(([x, y, h], i) =>
      `<rect x="${x}" y="${y}" width="2.4" height="${h}" rx=".8" fill="${i < lit ? 'var(--ink-2)' : 'var(--line)'}"/>`).join('');
    return `<svg width="14" height="14" viewBox="0 0 14 14" aria-label="${PRIORITIES.find((x) => x.id === p).label}" role="img">${bars}</svg>`;
  }
  function ring(pct, size = 14) {
    const r = 5.5, c = 2 * Math.PI * r;
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="${r}" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="7" cy="7" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="${(pct * c).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 7 7)" stroke-linecap="round"/></svg>`;
  }
  const icon = {
    all: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3.5h10M2 7h10M2 10.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    overview: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 5h5M4.5 7.2h5M4.5 9.4h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    decisions: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8 12.2 7 7 12.2 1.8 7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  };

  /* Derived data */
  const projectOf = (id) => state.projects.find((p) => p.id === id);
  function progress(pid) {
    const list = state.issues.filter((i) => i.project === pid && i.status !== 'canceled');
    const done = list.filter((i) => i.status === 'done').length;
    return { done, total: list.length, pct: list.length ? done / list.length : 0 };
  }
  function visibleIssues() {
    let list = state.issues;
    if (state.view === 'active') list = list.filter((i) => ['todo', 'in_progress', 'in_review'].includes(i.status));
    else if (state.view === 'backlog') list = list.filter((i) => i.status === 'backlog');
    else if (state.view === 'done') list = list.filter((i) => i.status === 'done' || i.status === 'canceled');
    else if (state.view.startsWith('project:')) list = list.filter((i) => i.project === state.view.slice(8));
    const q = state.query.trim().toLowerCase();
    if (q) list = list.filter((i) => [i.key, i.title, i.summary, ...(i.labels || [])].join(' ').toLowerCase().includes(q));
    return list;
  }

  /* Sidebar */
  function renderSide() {
    const n = (f) => state.issues.filter(f).length;
    const openDecisions = state.decisions.filter((d) => !d.chosen).length;
    const item = (view, label, ico, count) =>
      `<button class="nav-item" data-view="${view}" aria-current="${state.view === view}">${ico}<span>${esc(label)}</span>${count != null ? `<span class="count">${count}</span>` : ''}</button>`;
    $('side').innerHTML = `
      <div class="ws"><div class="ws-mark">K</div><div><div class="ws-name">Kept</div><div class="ws-sub">Backend roadmap</div></div></div>
      <div class="nav-group">
        ${item('overview', 'Overview', icon.overview)}
        ${item('decisions', 'Decisions', icon.decisions, state.loaded ? openDecisions || null : null)}
      </div>
      <div class="nav-group">
        <div class="nav-label">Issues</div>
        ${item('all', 'All issues', icon.all, state.loaded ? state.issues.length : null)}
        ${item('active', 'Active', statusIcon('in_progress'), state.loaded ? n((i) => ['todo', 'in_progress', 'in_review'].includes(i.status)) : null)}
        ${item('backlog', 'Backlog', statusIcon('backlog'), state.loaded ? n((i) => i.status === 'backlog') : null)}
        ${item('done', 'Done', statusIcon('done'), state.loaded ? n((i) => i.status === 'done') : null)}
      </div>
      <div class="nav-group">
        <div class="nav-label">Phases</div>
        ${state.projects.slice().sort(byOrder).map((p) => {
          const pr = progress(p.id);
          return item('project:' + p.id, p.name, ring(pr.pct), null);
        }).join('')}
      </div>`;
  }

  /* Top bar */
  function renderBar() {
    let title = 'All issues', crumb = '';
    if (state.view === 'active') title = 'Active';
    if (state.view === 'backlog') title = 'Backlog';
    if (state.view === 'done') title = 'Done';
    if (state.view === 'overview') title = 'Overview';
    if (state.view === 'decisions') title = 'Decisions';
    if (state.view.startsWith('project:')) { crumb = 'Phases'; title = projectOf(state.view.slice(8))?.name || 'Phase'; }
    const isList = !['overview', 'decisions'].includes(state.view);
    $('bar').innerHTML = `
      ${crumb ? `<span class="crumb">${esc(crumb)} ›</span>` : ''}<h1>${esc(title)}</h1>
      <span class="spacer"></span>
      ${isList ? `
        <div class="seg" role="group" aria-label="Group by">
          <button data-group="status" aria-pressed="${state.group === 'status'}">Status</button>
          <button data-group="project" aria-pressed="${state.group === 'project'}">Phase</button>
        </div>
        <input class="search" id="search" type="search" placeholder="Filter issues" value="${esc(state.query)}" aria-label="Filter issues">` : ''}`;
  }

  /* Views */
  function rowHtml(i) {
    const p = projectOf(i.project);
    const labels = (i.labels || []).slice(0, 2).map((l) => `<span class="chip"><i style="background:${LABEL_COLORS[l] || 'var(--ink-3)'}"></i>${esc(l)}</span>`).join('');
    return `<button class="row" data-key="${esc(i.key)}" aria-selected="${state.open === i.key}">
      ${priorityIcon(i.priority)}
      <span class="key">${esc(i.key)}</span>
      ${statusIcon(i.status)}
      <span class="title">${esc(i.title)}</span>
      <span class="chips">${labels}</span>
      <span class="proj">${p ? ring(progress(p.id).pct, 12) + esc(p.short || p.name) : ''}</span>
      <span class="est">${i.estimate ? i.estimate + ' pt' : ''}</span>
    </button>`;
  }
  function renderList() {
    if (!state.loaded) return Array.from({ length: 9 }, () => '<div class="skeleton"></div>').join('');
    const list = visibleIssues().slice().sort((a, b) => (a.priority || 9) - (b.priority || 9) || issueNum(a.key) - issueNum(b.key));
    if (!list.length) return `<div class="empty">${state.query ? `No issues match “${esc(state.query)}”.` : 'Nothing here yet.'}</div>`;
    const groups = state.group === 'status'
      ? STATUSES.map((s) => ({ head: statusIcon(s.id) + esc(s.label), items: list.filter((i) => i.status === s.id) }))
      : state.projects.slice().sort(byOrder).map((p) => ({ head: ring(progress(p.id).pct) + esc(p.name), items: list.filter((i) => i.project === p.id) }));
    return groups.filter((g) => g.items.length).map((g) =>
      `<div class="group-head">${g.head}<span class="count">${g.items.length}</span></div>${g.items.map(rowHtml).join('')}`).join('');
  }

  const SEAM = [
    ['session.ts', 'getSession()', 'Cached Supabase session + AAL, read synchronously after boot', 'KEPT-13'],
    ['session.ts', 'signInWithPassword(username, password)', 'Edge Function `sign-in` → `auth.setSession()`', 'KEPT-12'],
    ['session.ts', 'completeMfaForLab()', 'Replaced by TOTP enroll / verify', 'KEPT-15'],
    ['session.ts', 'signOut()', '`auth.signOut()`', 'KEPT-13'],
    ['repository.ts', 'listCollections() · getCollection(id)', '`collection_summaries` view, slug as the id', 'KEPT-18'],
    ['repository.ts', 'createCollection(name) · updateCollection(id, patch)', 'RPC `create_collection` · update on `collections`', 'KEPT-18'],
    ['repository.ts', 'listReferences(id) · listAllReferences()', 'One nested select + batched signed URLs', 'KEPT-19'],
    ['repository.ts', 'updateReference(cid, rid, patch)', 'Notes update; RPCs `set_reference_tags`, `set_reference_pins`', 'KEPT-20'],
    ['repository.ts', 'addUploads(cid, files, onProgress)', 'On-device resize → rows → Storage uploads', 'KEPT-21'],
    ['repository.ts', 'getShare · publishCollection · rotateShare · unpublishCollection', '`collection_shares` + token RPCs', 'KEPT-23'],
    ['repository.ts', 'getBoard(token)', 'Edge Function `board` (no sign-in)', 'KEPT-24'],
    ['repository.ts', 'requestInvite(request)', 'RPC `request_invite` (anon)', 'KEPT-26'],
  ];
  const keyLink = (k) => `<button class="link-btn" data-key="${k}">${k}</button>`;

  function renderOverview() {
    const phases = state.projects.slice().sort(byOrder);
    const total = state.issues.filter((i) => i.status !== 'canceled');
    const done = total.filter((i) => i.status === 'done').length;
    return `<div class="doc">
      <section>
        <h2>Wire Kept to a real backend</h2>
        <p class="lede">The UI is finished: kept-design matches the kept-ui lab pixel for pixel, but every screen still reads from browser mocks. This roadmap replaces those mocks with Supabase (Postgres, Auth, Storage and two Edge Functions) behind the exact functions the screens already call, so no screen changes.</p>
      </section>
      <section>
        <h3>Where things stand</h3>
        <dl class="kv">
          <dt>UI</dt><dd>Done. All 16 routes and their states are pixel-identical to kept-ui (commit <code>7e9ddba</code>).</dd>
          <dt>Main branch</dt><dd>PR #4 is open against <code>main</code> and needs merging first (${keyLink('KEPT-1')}).</dd>
          <dt>Data</dt><dd>Mocked in <code>src/kept/repository.ts</code> and <code>session.ts</code>: localStorage, sessionStorage and IndexedDB, all device-local.</dd>
          <dt>Stack call</dt><dd>From the v0 spec: Vite + React + Base UI, Supabase for data, sign-in and files. No Next.js.</dd>
          <dt>Progress</dt><dd>${state.loaded ? `${done} of ${total.length} issues done` : '—'}</dd>
        </dl>
      </section>
      <section>
        <h3>How it fits together</h3>
<pre class="diagram">Browser · kept.design (Vite SPA, same screens as kept-ui)
│
├── supabase-js  (publishable key, user JWT)
│     ├── Auth      password + TOTP → AAL2; signup off
│     ├── Postgres  RLS on every table: owner_id = auth.uid() AND aal2
│     └── Storage   private bucket kept-assets/&lt;owner&gt;/&lt;ref&gt;/{full,thumb}.jpg
│
├── Edge Function  sign-in   username → email, then password sign-in
└── Edge Function  board     /m/:token → rows + short-lived signed image URLs
                             (the only path that works signed out)</pre>
      </section>
      <section>
        <h3>The seam: what each UI function becomes</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>File</th><th>Function</th><th>Backed by</th><th>Issue</th></tr></thead>
          <tbody>${SEAM.map(([f, fn, how, k]) => `<tr><td><code>${f}</code></td><td>${fmt(fn)}</td><td>${fmt(how)}</td><td>${keyLink(k)}</td></tr>`).join('')}</tbody>
        </table></div>
      </section>
      <section>
        <h3>Ground rules</h3>
        <ul class="plain">
          <li>kept-ui stays the source of truth and is never written to. New screens (two-factor, later box annotations and renaming) are designed there first, then synced.</li>
          <li><code>npm run sync-kept-ui</code> must never overwrite the real data layer again (${keyLink('KEPT-6')}).</li>
          <li>Same function names and return shapes. If kept-ui changes a shape, the typecheck fails before anything ships.</li>
          <li>Only the publishable key reaches the browser. The service-role key lives in Edge Function secrets and a local seed script, never behind a <code>VITE_</code> prefix.</li>
          <li>Without Supabase env vars the app falls back to the mocks, so previews and the lab flow keep working.</li>
          <li>The pixel sweep is re-run once real data flows: the UI must still match kept-ui.</li>
        </ul>
      </section>
      <section>
        <h3>Phases</h3>
        <div class="cards">${phases.map((p) => {
          const pr = progress(p.id);
          return `<button class="card" data-view="project:${p.id}">
            <div class="card-head">${ring(pr.pct)}${esc(p.name)}</div>
            <p>${esc(p.summary)}</p>
            <div class="meter"><span style="width:${Math.round(pr.pct * 100)}%"></span></div>
            <div class="card-foot"><span>${pr.done} / ${pr.total} done</span><span>${esc(p.target || '')}</span></div>
          </button>`;
        }).join('') || '<div class="skeleton"></div>'}</div>
      </section>
    </div>`;
  }

  function renderDecisions() {
    if (!state.loaded) return '<div class="doc"><div class="skeleton"></div><div class="skeleton"></div></div>';
    const list = state.decisions.slice().sort(byOrder);
    return `<div class="doc">
      <section><h2>Decisions</h2><p>Calls that shape the build. Each has a recommendation; pick one and it's saved here for both of us.</p></section>
      ${list.map((d) => `<section class="decision" data-decision="${esc(d.id)}">
        <div class="decision-head"><span class="key">${esc(d.key || '')}</span><h3>${esc(d.title)}</h3>
          <span class="badge ${d.chosen ? 'decided' : 'open'}">${d.chosen ? 'Decided' : 'Open'}</span></div>
        <p>${fmt(d.question)}</p>
        <div class="options" role="radiogroup" aria-label="${esc(d.title)}">
          ${(d.options || []).map((o) => `<button class="option" role="radio" aria-checked="${d.chosen === o.id}" data-choose="${esc(o.id)}" ${state.writable ? '' : 'disabled'}>
            <span class="dot"></span><span><b>${esc(o.label)}</b>${d.recommended === o.id ? '<span class="rec">Recommended</span>' : ''}<small>${fmt(o.detail)}</small></span>
          </button>`).join('')}
        </div>
      </section>`).join('')}
    </div>`;
  }

  function renderView() {
    const v = $('view');
    if (state.view === 'overview') v.innerHTML = renderOverview();
    else if (state.view === 'decisions') v.innerHTML = renderDecisions();
    else v.innerHTML = renderList();
  }

  /* Detail panel */
  function renderPanel() {
    const o = $('overlay');
    const i = state.issues.find((x) => x.key === state.open);
    if (!i) { o.innerHTML = ''; return; }
    const p = projectOf(i.project);
    const blocks = (i.blockedBy || []).map((k) => {
      const b = state.issues.find((x) => x.key === k);
      return `<span class="chip">${b ? statusIcon(b.status, 12) : ''}${keyLink(k)}</span>`;
    }).join('') || '<span class="ws-sub">None</span>';
    const blocking = state.issues.filter((x) => (x.blockedBy || []).includes(i.key)).map((x) => `<span class="chip">${statusIcon(x.status, 12)}${keyLink(x.key)}</span>`).join('') || '<span class="ws-sub">None</span>';
    const dis = state.writable && state.dbOk && !state.static ? '' : 'disabled';
    o.innerHTML = `<div class="scrim" data-close></div>
      <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-top"><span class="key">${esc(i.key)}</span><span class="ws-sub">${esc(p?.name || '')}</span><span class="spacer"></span><button class="icon-btn" data-close aria-label="Close">Close</button></div>
        <div class="panel-body">
          <h2 id="panel-title">${esc(i.title)}</h2>
          <dl class="props">
            <dt>Status</dt><dd>${statusIcon(i.status)}<select class="select" id="f-status" ${dis}>${STATUSES.map((s) => `<option value="${s.id}" ${s.id === i.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></dd>
            <dt>Priority</dt><dd>${priorityIcon(i.priority)}<select class="select" id="f-priority" ${dis}>${PRIORITIES.map((x) => `<option value="${x.id}" ${x.id === (i.priority || 0) ? 'selected' : ''}>${x.label}</option>`).join('')}</select></dd>
            <dt>Estimate</dt><dd>${i.estimate ? i.estimate + ' points' : '<span class="ws-sub">None</span>'}</dd>
            <dt>Labels</dt><dd>${(i.labels || []).map((l) => `<span class="chip"><i style="background:${LABEL_COLORS[l] || 'var(--ink-3)'}"></i>${esc(l)}</span>`).join('') || '<span class="ws-sub">None</span>'}</dd>
            <dt>Blocked by</dt><dd>${blocks}</dd>
            <dt>Blocks</dt><dd>${blocking}</dd>
          </dl>
          ${i.summary ? `<div class="section"><h3>Why</h3><p>${fmt(i.summary)}</p></div>` : ''}
          ${i.steps?.length ? `<div class="section"><h3>Approach</h3><ol>${i.steps.map((s) => `<li>${fmt(s)}</li>`).join('')}</ol></div>` : ''}
          ${i.code ? `<div class="section"><h3>Sketch</h3><pre>${esc(i.code)}</pre></div>` : ''}
          ${i.acceptance?.length ? `<div class="section"><h3>Done when</h3><ul class="checks">${i.acceptance.map((s) => `<li><span>${fmt(s)}</span></li>`).join('')}</ul></div>` : ''}
          ${i.notes ? `<div class="section"><h3>Notes</h3><p>${fmt(i.notes)}</p></div>` : ''}
        </div>
      </aside>`;
    o.querySelector('.panel .icon-btn')?.focus({ preventScroll: true });
  }

  function render() {
    renderSide(); renderBar(); renderView(); renderPanel();
    const note = $('note');
    if (state.static) { note.hidden = false; note.innerHTML = 'Static copy from the repo. To change it, edit <code>docs/roadmap/roadmap.json</code>, then run <code>node scripts/roadmap.mjs</code>.'; }
    else if (state.dbOk === false) { note.hidden = false; note.textContent = 'The roadmap data isn’t available in this view. Open the page on claude.ai to see and update it.'; }
    else if (state.dbOk && !state.writable && !state.static) { note.hidden = false; note.textContent = 'You can view this roadmap but not change it.'; }
    else note.hidden = true;
  }

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
  }

  /* Events */
  document.addEventListener('click', (e) => {
    const view = e.target.closest('[data-view]');
    if (view) { state.view = view.dataset.view; state.query = ''; savePrefs(); render(); $('view').scrollTop = 0; return; }
    const group = e.target.closest('[data-group]');
    if (group) { state.group = group.dataset.group; savePrefs(); render(); return; }
    const key = e.target.closest('[data-key]');
    if (key) { state.open = key.dataset.key; render(); return; }
    if (e.target.closest('[data-close]')) { state.open = null; render(); return; }
    const choose = e.target.closest('[data-choose]');
    if (choose && !choose.disabled) {
      const id = choose.closest('[data-decision]').dataset.decision;
      const d = state.decisions.find((x) => x.id === id);
      const chosen = d.chosen === choose.dataset.choose ? null : choose.dataset.choose;
      write('decisions/' + id, { chosen }, chosen ? 'Decision saved' : 'Decision reopened');
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'search') {
      state.query = e.target.value;
      renderView(); renderSide();
    }
  });
  document.addEventListener('change', (e) => {
    const i = state.issues.find((x) => x.key === state.open);
    if (!i) return;
    if (e.target.id === 'f-status') write('issues/' + i.key, { status: e.target.value, updatedAt: new Date().toISOString() }, 'Status updated');
    if (e.target.id === 'f-priority') write('issues/' + i.key, { priority: Number(e.target.value), updatedAt: new Date().toISOString() }, 'Priority updated');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.open) { state.open = null; render(); }
    if (e.key === '/' && document.activeElement?.tagName !== 'INPUT' && $('search')) { e.preventDefault(); $('search').focus(); }
  });

  /* Data */
  let db = null;
  async function write(path, patch, msg) {
    if (!db) return;
    try { await db.doc(path).update(patch); toast(msg); }
    catch (err) {
      if (err?.code === 'invalid_argument') { state.writable = false; render(); toast('You can’t change this roadmap.'); }
      else toast('Couldn’t save. Try again.');
    }
  }
  function listen(name, key) {
    db.collection(name).onSnapshot((snap) => {
      state[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      state.loaded = true;
      const search = $('search');
      const had = document.activeElement === search;
      const pos = had ? search.selectionStart : 0;
      render();
      if (had && $('search')) { $('search').focus(); $('search').setSelectionRange(pos, pos); }
    }, () => { state.dbOk = false; render(); });
  }

  render();
  (async () => {
    db = window.claude?.use ? await window.claude.use('db') : null;
    // The repo copy (docs/roadmap/index.html) embeds its data instead of using the live store.
    const embedded = document.getElementById('roadmap-data');
    if (!db && embedded) {
      const data = JSON.parse(embedded.textContent);
      Object.assign(state, { projects: data.projects, decisions: data.decisions, issues: data.issues, loaded: true, dbOk: true, writable: false, static: true });
      render();
      return;
    }
    if (!db) { state.dbOk = false; state.loaded = true; render(); return; }
    state.dbOk = true;
    listen('projects', 'projects');
    listen('decisions', 'decisions');
    listen('issues', 'issues');
  })();
})();
</script>

</body>
</html>
